# Run the full Model Senate/Council stack (backend + bundled UI) on http://localhost:8001
# Copy .env.example to .env and populate keys first (or point routes at local models).
services:
  model-senate:
    build: .
    image: model-senate:latest
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - MODEL_SENATE_HOST=0.0.0.0
    restart: unless-stopped
