name: Publish to PyPI

# Publishes `uvx model-senate` on a version tag. Requires a PyPI Trusted Publisher
# configured for this repo/workflow (https://docs.pypi.org/trusted-publishers/).
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Bundle the production UI into the wheel
        run: python3 scripts/bundle_frontend.py
      - name: Build wheel + sdist
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
